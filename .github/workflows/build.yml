name: Build ngstep ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container:
      image: devuan/devuan:excalibur
      volumes:
        - /proc:/proc
      options: --privileged
    name: Build ISO (${{ matrix.runner }})
    steps:
      - name: Install build tools
        run: |
          apt-get update
          arch=$(uname -m)
          case "$arch" in
            x86_64|i?86)
              GRUB_PKGS="grub-pc-bin grub-efi-amd64-bin"
              ;;
            aarch64|arm64)
              GRUB_PKGS="grub-efi-arm64-bin"
              ;;
          esac
          apt-get install -y \
            git debootstrap squashfs-tools xorriso \
            grub-common $GRUB_PKGS \
            mtools dosfstools wget curl

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload ISO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -lh *.iso
          wget -c https://github.com/probonopd/uploadtool/raw/master/upload.sh
          bash upload.sh *.iso
