name: Build ngstep-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            container: ghcr.io/ngstep-app/devuan-amd64:latest
            name: devuan-amd64
          - runner: ubuntu-24.04-arm
            container: ghcr.io/ngstep-app/devuan-arm64:latest
            name: devuan-arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
      volumes:
        - /proc:/proc
      options: --privileged
    name: Build ISO (${{ matrix.name }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Diagnose XLibre key fetch
        run: |
          echo "==> Runner public IP:"
          curl -fsS https://api.ipify.org || true
          echo
          echo "==> DNS for mrchicken.nexussfan.cz:"
          getent hosts mrchicken.nexussfan.cz || true
          echo "==> curl with default UA:"
          curl -vI https://mrchicken.nexussfan.cz/publickey.asc 2>&1 | head -80 || true
          echo "==> curl with browser UA:"
          curl -vI -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
            https://mrchicken.nexussfan.cz/publickey.asc 2>&1 | head -80 || true
          echo "==> Response body (first 40 lines, browser UA):"
          curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
            https://mrchicken.nexussfan.cz/publickey.asc 2>&1 | head -40 || true
          echo "==> HTTP/1.1 forced:"
          curl -vI --http1.1 https://mrchicken.nexussfan.cz/publickey.asc 2>&1 | head -40 || true

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload ISO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -lh *.iso
          wget -c https://github.com/probonopd/uploadtool/raw/master/upload.sh
          bash upload.sh *.iso
