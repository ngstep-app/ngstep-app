name: Build ngstep-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            container: ghcr.io/ngstep-app/devuan-amd64:latest
            name: devuan-amd64
          - runner: ubuntu-24.04-arm
            container: ghcr.io/ngstep-app/devuan-arm64:latest
            name: devuan-arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
      volumes:
        - /proc:/proc
      options: --privileged
    name: Build ISO (${{ matrix.name }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload ISO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -lh *.iso
          wget -c https://github.com/probonopd/uploadtool/raw/master/upload.sh
          bash upload.sh *.iso
